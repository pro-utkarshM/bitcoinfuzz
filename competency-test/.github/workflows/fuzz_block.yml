name: Fuzz Block Deserialization

on:
  push:
    paths:
      - 'modules/cpp_block/**'
      - 'modules/rust_block/**'
      - 'scripts/**'
      - 'seeds/**'
  pull_request:

jobs:
  fuzz:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev libbitcoinconsensus-dev cmake make cargo

      - name: Build and run
        run: |
          bash scripts/build_and_run.sh

      - name: Upload crashes
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: fuzz-crashes
          path: modules/cpp_block/build/crashes